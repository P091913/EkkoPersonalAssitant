# Ekko's Docker proxy: the only way the Brain reaches Docker. The Docker socket is root on the whole machine, so this
# allows exactly what the server-ops tools need and refuses everything else (create, exec, delete, images, and any
# restart but Jellyfin's) - whatever the Brain asks. Paths are matched raw, so an encoded character can't sneak past.
# Changing what can be restarted means changing ServerOps:Restartable in the Brain AND the restart rule here.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend docker
    bind :2375
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs)$ }
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/system/df$ }
    http-request allow if METH_POST { path -m reg ^(/v[0-9.]+)?/containers/jellyfin/restart$ }
    http-request deny
    default_backend dockerd

backend dockerd
    server dockerd /var/run/docker.sock
