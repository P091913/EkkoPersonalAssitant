name: ekko

services:
  brain:
    build:
      context: .
      dockerfile: Ekko.Brain/Dockerfile
    image: ekko-brain
    container_name: ekko-brain
    restart: unless-stopped
    ports:
      - "5060:8080"            # POST /message on http://<this PC>:5060
    # Secrets, never committed (see .gitignore): ANTHROPIC_API_KEY, Api__Key (callers -> Brain),
    # PcService__ApiKey (Brain -> PC agent; Ekko.PcAgent/install.ps1 reads the same line), TvRemote__ApiKey
    # (Brain -> tvremote; same value as tvremote's own Api__Key). PcAgent_DeckKey is also in .env for install.ps1;
    # the Brain ignores it.
    env_file: .env
    environment:
      # Other services are reached through their published host ports, not shared Docker networks,
      # so each one can move or be replaced without touching this file's neighbours.
      Llm__Clients__qwen__BaseUrl: http://host.docker.internal:11434/v1/
      PcService__BaseUrl: http://host.docker.internal:5070/  # Ekko.PcAgent, native on Windows
      TvRemote__BaseUrl: http://host.docker.internal:5055/   # tvremote container, via its published port
      Budget__BaseUrl: http://host.docker.internal:5080/     # the budget service below, via its published port
    volumes:
      - ./data:/app/data       # trace.jsonl, readable from the host

  budget:
    build:
      context: .
      dockerfile: Ekko.Budget/Dockerfile
    image: ekko-budget
    container_name: ekko-budget
    restart: unless-stopped
    ports:
      - "5080:8080"            # /budget/* on http://<this PC>:5080
    # Only what this service needs, picked out of .env: it never sees the Anthropic key or other services' keys.
    environment:
      Api__Keys__brain: ${Budget__ApiKey:?set Budget__ApiKey in .env}
      Sheet__SpreadsheetId: ${Budget_SpreadsheetId:?set Budget_SpreadsheetId in .env}
      Sheet__KeyFile: /run/secrets/google-sheets
      TZ: America/Chicago      # a new row is dated by the house's day, not UTC's
    secrets:
      - google-sheets

secrets:
  google-sheets:
    file: ${GOOGLE_SHEETS_KEY_FILE:?set GOOGLE_SHEETS_KEY_FILE in .env to the service account's JSON key}
