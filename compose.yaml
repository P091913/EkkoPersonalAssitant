name: ekko

services:
  brain:
    build:
      context: .
      dockerfile: Ekko.Brain/Dockerfile
    image: ekko-brain
    container_name: ekko-brain
    restart: unless-stopped
    ports:
      # POST /message on http://<this PC>:5065. Not 5060: that's SIP, on fetch's blocked-port list, so browsers and
      # Node refuse to connect to it at all ("bad port").
      - "5065:8080"
    # Secrets, never committed (see .gitignore): ANTHROPIC_API_KEY, Api__Keys__deck, Api__Keys__telegram,
    # Api__Keys__glasses and Api__Keys__desk (one key per client -> Brain), Desk__ApiKey (Brain -> ekko-desk),
    # PcService__ApiKey (Brain -> PC agent; Ekko.PcAgent/install.ps1 reads the same line), TvRemote__ApiKey
    # (Brain -> tvremote; same value as tvremote's own Api__Key). PcAgent_DeckKey is also in .env for install.ps1;
    # the Brain ignores it.
    env_file: .env
    environment:
      # Other services are reached through their published host ports, not shared Docker networks,
      # so each one can move or be replaced without touching this file's neighbours.
      Llm__Clients__qwen__BaseUrl: http://host.docker.internal:11434/v1/
      PcService__BaseUrl: http://host.docker.internal:5070/  # Ekko.PcAgent, native on Windows
      TvRemote__BaseUrl: http://host.docker.internal:5055/   # tvremote container, via its published port
      Budget__BaseUrl: http://host.docker.internal:5080/     # the budget service below, via its published port
      Food__BaseUrl: http://host.docker.internal:5085/       # the food service below, via its published port
      # ekko-desk (DR-39): http://host.docker.internal:8081/ while it runs on this PC, then the Pi's tailnet URL, so it lives in .env.
      Desk__BaseUrl: ${Desk_BaseUrl:?set Desk_BaseUrl in .env}
    volumes:
      - ./data:/app/data       # trace.jsonl and saved server-ops runs, readable from the host
      # The server-ops agent measures the media drive. Read-only, and the only host folder it can see (ServerOps:Roots).
      - type: bind
        source: D:/Media
        target: /host/media
        read_only: true
    networks: [default, docker-api]

  # The Brain's only way to Docker: HAProxy with Ekko's own rules (ops/docker-proxy/haproxy.cfg). A sidecar, not a
  # service: no published port, on a network only the Brain shares, because the socket behind it is root on this PC.
  docker-proxy:
    image: haproxy:3.2.26-alpine
    container_name: ekko-docker-proxy
    restart: unless-stopped
    user: root                 # the socket is root-only; this container holds it so the Brain never does
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [docker-api]

  budget:
    build:
      context: .
      dockerfile: Ekko.Budget/Dockerfile
    image: ekko-budget
    container_name: ekko-budget
    restart: unless-stopped
    ports:
      - "5080:8080"            # /budget/* on http://<this PC>:5080
    # Only what this service needs, picked out of .env: it never sees the Anthropic key or other services' keys.
    environment:
      Api__Keys__brain: ${Budget__ApiKey:?set Budget__ApiKey in .env}
      Api__Keys__desk: ${Budget_DeskKey:?set Budget_DeskKey in .env}   # the desk's Today card (DR-43)
      Api__ReadOnly__0: desk                                           # ...which may only read
      Api__Keys__glasses: ${Budget_GlassesKey:?set Budget_GlassesKey in .env}  # the G2 glasses app (DR-45)
      Api__Writes__glasses__0: POST /budget/bills/paid                 # ...which reads, and only checks bills off (DR-46)
      Sheet__SpreadsheetId: ${Budget_SpreadsheetId:?set Budget_SpreadsheetId in .env}
      Sheet__KeyFile: /run/secrets/google-sheets
      TZ: America/Chicago      # a new row is dated by the house's day, not UTC's
    secrets:
      - google-sheets

  food:
    build:
      context: .
      dockerfile: Ekko.Food/Dockerfile
    image: ekko-food
    container_name: ekko-food
    restart: unless-stopped
    ports:
      - "5085:8080"            # /food/* on http://<this PC>:5085
    # Only its own key from .env: it holds no other secrets.
    environment:
      Api__Keys__brain: ${Food__ApiKey:?set Food__ApiKey in .env}
      Api__Keys__desk: ${Food_DeskKey:?set Food_DeskKey in .env}       # the desk's Today card and quick food log (DR-43)
      TZ: America/Chicago      # "today" is the house's day, not UTC's
    volumes:
      # A Docker volume, not a folder on C:. SQLite needs file locks that Windows bind mounts don't reliably give.
      - food:/app/data

  # Text and voice notes from your phone (DR-37). Long-polls Telegram: every connection is outgoing, so no ports.
  # Nothing else may receive this bot's messages (two receivers take each other's): the Pi's pc-waker.service is off.
  telegram:
    build:
      context: .
      dockerfile: Ekko.Telegram/Dockerfile
    image: ekko-telegram
    container_name: ekko-telegram
    restart: unless-stopped
    # Only what this service needs: the bot token never goes anywhere else it's used.
    environment:
      Telegram__BotToken: ${Telegram_BotToken:?set Telegram_BotToken in .env}
      Telegram__AllowedUsers: ${Telegram_AllowedUsers:?set Telegram_AllowedUsers in .env}
      Brain__BaseUrl: http://host.docker.internal:5065/
      Brain__ApiKey: ${Api__Keys__telegram:?set Api__Keys__telegram in .env}
      Speech__BaseUrl: http://host.docker.internal:8000/   # speaches, for voice notes
      Files__BaseUrl: http://host.docker.internal:5095/    # photos and PDFs go to the file store below
      Files__ApiKey: ${Files_TelegramKey:?set Files_TelegramKey in .env}
      TZ: America/Chicago      # "you sent this at 2:05 PM" in the house's time

  # Photos and PDFs sent to Ekko from Telegram or the deck, kept for the desk to show (DR-40).
  files:
    build:
      context: .
      dockerfile: Ekko.Files/Dockerfile
    image: ekko-files
    container_name: ekko-files
    restart: unless-stopped
    ports:
      - "5095:8080"            # /files on http://<this PC>:5095; the Pi reaches it over the tailnet, as it does the Brain
    # One key per client, picked out of .env: it holds no other secrets.
    environment:
      Api__Keys__telegram: ${Files_TelegramKey:?set Files_TelegramKey in .env}
      Api__Keys__deck: ${Files_DeckKey:?set Files_DeckKey in .env}
      Api__Keys__desk: ${Files_DeskKey:?set Files_DeskKey in .env}
      Files__PcFolder: /host/pc
    volumes:
      - files:/app/data
      # Your Downloads (DR-41), read-only: the photos and PDFs saved there are listed and served too. Only that folder's
      # top level, and nothing in it can be changed. The path lives in .env, to keep it out of git.
      - type: bind
        source: ${Files_PcFolder:?set Files_PcFolder in .env to your Downloads folder}
        target: /host/pc
        read_only: true

  # Ekko on the Even G2 (DR-38): the page the Even app runs, and /hear + /ask behind the page's own key.
  glasses:
    build:
      context: .
      dockerfile: Ekko.Glasses/Dockerfile
    image: ekko-glasses
    container_name: ekko-glasses
    restart: unless-stopped
    ports:
      # This PC only, never the LAN. `tailscale serve --bg --https=8444 http://127.0.0.1:5090` puts it on the
      # tailnet, with HTTPS, which the phone's mic needs in preview.
      - "127.0.0.1:5090:8080"
    # Only what this service needs. The Brain key stays here; the phone only ever holds the page key.
    environment:
      Glasses__PageKey: ${Glasses_PageKey:?set Glasses_PageKey in .env}
      Brain__BaseUrl: http://host.docker.internal:5065/
      Brain__ApiKey: ${Api__Keys__glasses:?set Api__Keys__glasses in .env}
      Speech__BaseUrl: http://host.docker.internal:8000/   # speaches

secrets:
  google-sheets:
    file: ${GOOGLE_SHEETS_KEY_FILE:?set GOOGLE_SHEETS_KEY_FILE in .env to the service account's JSON key}

networks:
  docker-api:
    internal: true             # no route out, and nothing outside it can reach the proxy

volumes:
  food:                        # the food list and diary (ekko_food); back up with: docker cp ekko-food:/app/data/food.db .
  files:                       # photos and PDFs (ekko_files); back up with: docker cp ekko-files:/app/data/files .
